# Quartas e sextas, lista os PRs abertos há 3+ dias (em todos os repositórios públicos)
# numa issue única "🔔 PRs waiting for review" e menciona você. Fecha a issue quando não há.
# Para mudar o prazo: REMINDER_DAYS. Para desativar: Actions > PR review reminder > "Disable workflow".
name: PR review reminder

on:
  schedule:
    - cron: "0 12 * * 3,5" # quartas e sextas, 09:00 em Brasília
  workflow_dispatch:
    inputs:
      days:
        description: "Minimum PR age in days"
        type: number
        default: 3

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --python 3.13 scripts/weekly_report.py reminder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMINDER_DAYS: ${{ inputs.days || 3 }}
