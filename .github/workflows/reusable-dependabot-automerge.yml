# Workflow REUTILIZÁVEL: faz merge (squash) de PRs do Dependabot de versão MINOR ou PATCH
# depois que TODOS os checks do PR passam. A espera é explícita (consulta a API de check-runs),
# então funciona mesmo em repositórios cujo ruleset não exige checks (perfil e jornada, onde
# workflows precisam commitar direto na main). Se algum check falhar, não faz merge.
# Atualizações MAJOR recebem um comentário e ficam para revisão manual.
name: Reusable · Dependabot auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  actions: read # para listar as execuções de workflow do commit

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for required checks, then merge (minor/patch)
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          # Espera todas as execuções de workflow deste commit (menos esta) terminarem.
          # Execuções de workflow são criadas juntas, no evento; check-runs de jobs com
          # "needs" podem aparecer depois, por isso não servem para decidir sozinhos.
          sleep 15
          filter="[.workflow_runs[] | select(.id != $RUN_ID)]"
          for attempt in $(seq 1 120); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq "$filter")
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")
            echo "checks: total=$total pending=$pending failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "::error::Há checks com falha; o merge não será feito."
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              gh pr merge --squash "$PR_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Tempo esgotado esperando os checks."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major update for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ Major version update: auto-merge is disabled. Please review the changelog before merging."
          gh pr edit "$PR_URL" --add-label "priority: medium"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
