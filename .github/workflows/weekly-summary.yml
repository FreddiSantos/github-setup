# Toda segunda, cria uma issue "📊 Weekly summary — AAAA-Www" com a atividade da semana
# em todos os repositórios públicos, e fecha o resumo anterior.
# Para desativar: Actions > Weekly summary > "Disable workflow".
name: Weekly summary

on:
  schedule:
    - cron: "0 11 * * 1" # segundas, 08:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --python 3.13 scripts/weekly_report.py summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
